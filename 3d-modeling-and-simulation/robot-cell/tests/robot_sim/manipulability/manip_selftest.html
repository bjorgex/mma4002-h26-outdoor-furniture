<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>manip selftest</title>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
</head><body><pre id="out">running</pre>
<!-- Checks manip_layers.js's live measures (JS) against manipulability.py for a few joint sets:
     open via any http server, e.g. http://127.0.0.1:8765/.../tests/robot_sim/manipulability/manip_selftest.html -->
<script type="module">
import * as THREE from "three";
import { measuresFrom } from "../manip_layers.js";
const D1 = 145.2, A2 = 429.0, A3 = 411.5, D4 = 122.3, D5 = 106.0, D6 = 113.15, deg = Math.PI / 180;
const CHAIN = [[[0, 0, D1], [0, 0, 0]], [[0, 0, 0], [-90, -90, 0]], [[A2, 0, 0], [0, 0, 0]],
               [[A3, 0, -D4], [0, 0, 90]], [[0, -D5, 0], [90, 0, 0]], [[0, -D6, 0], [90, 0, 0]]];
const scene = new THREE.Scene(), joints = [];
let parent = scene;
for (const [xyz, rpy] of CHAIN) {
  const f = new THREE.Group(); f.position.set(...xyz); f.rotation.set(rpy[0] * deg, rpy[1] * deg, rpy[2] * deg, "ZYX");
  const t = new THREE.Group(); f.add(t); parent.add(f); joints.push(t); parent = t;
}
const Q = [[-14.0892, 2.9168, -80.0986, -12.7472, -90.0099, 75.8867], [-18.4, 13.8, -109.6, 6.0, -90.0, 161.5],
           [-97.3, -115.1, 155.8, 45.1, 60.2, 81.5], [-23.2, -82.1, -9.1, -119.4, -101.5, -173.3], [0, 20, -0.1, -20, -90, 0]];
const out = Q.map(q => { q.forEach((a, i) => joints[i].rotation.z = a * deg);
  const m = measuresFrom(THREE, joints, 160);
  return { q, p: m.p.toArray().map(v => +v.toFixed(2)), mu1: +m.mu1.toPrecision(6), mu3: +m.mu3.toPrecision(6),
           mu1_v: +m.mu1_v.toPrecision(6), mu3_v: +m.mu3_v.toPrecision(6), margin: +m.margin.toFixed(2) }; });
document.getElementById("out").textContent = ["RESULT", ...out.map(o => JSON.stringify(o))].join(String.fromCharCode(10));
</script></body></html>
